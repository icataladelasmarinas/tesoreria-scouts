<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesoreria Grupo Scout Pio XII - Registro de Facturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4c1d95;       /* Morado principal */
      --primary-dark: #2e1065;  /* Morado muy oscuro (hover y textos) */
      --primary-light: #f3e8ff; /* Morado suave para fondos y toques */
      --accent: #d97706;        /* Dorado / Ámbar para selecciones */
      --accent-gold: #f59e0b;   /* Dorado brillante */
      --bg: #faf5ff;            /* Fondo general claro con matiz lila */
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(76, 29, 149, 0.08), 0 8px 10px -6px rgba(76, 29, 149, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 14px 40px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-fleur {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(45, 90, 39, 0.25);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    label span.req {
      color: #ef4444;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: #fafafa;
      color: var(--text);
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(45, 90, 39, 0.12);
    }

    .currency-input {
      position: relative;
    }

    .currency-input input {
      padding-right: 40px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .currency-symbol {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      color: var(--text-muted);
      font-size: 18px;
    }

    /* Scanner / Camera Dropzone */
    .scanner-box {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      background: #f9fafb;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .scanner-box:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .scanner-box.has-file {
      border-color: var(--primary);
      background: #fff;
      padding: 12px;
    }

    .scanner-icon {
      font-size: 32px;
      margin-bottom: 6px;
      display: block;
    }

    .scanner-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }

    .scanner-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    #previewContainer {
      display: none;
      position: relative;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      max-height: 220px;
    }

    #previewImg {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Section Chips */
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .chip-radio {
      display: none;
    }

    .chip-label {
      display: block;
      text-align: center;
      padding: 10px 6px;
      background: #f3f4f6;
      border: 1.5px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-radio:checked + .chip-label {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
      box-shadow: 0 4px 10px rgba(45, 90, 39, 0.2);
    }

    /* Payment Radio Grid */
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .payment-radio {
      display: none;
    }

    .payment-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      background: #f9fafb;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .payment-radio:checked + .payment-label {
      background: #fef3c7;
      border-color: var(--accent);
      color: #92400e;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(45, 90, 39, 0.35);
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Status Banner */
    #statusAlert {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .config-note {
      margin-top: 20px;
      padding: 12px;
      background: #fffbeb;
      border-radius: 10px;
      border: 1px dashed #f59e0b;
      font-size: 12px;
      color: #78350f;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge-fleur">⚜️</div>
      <h1>Tesorería Grupo Scout Pio XII</h1>
      <p>Registro rápido de gastos y facturas</p>
    </div>

    <div class="card">
      <form id="expenseForm">
        
        <!-- Scanner / Ticket Capture -->
        <div class="form-group">
          <label>Foto del Ticket / Factura <span class="req">*</span></label>
          <div class="scanner-box" id="dropzone" onclick="document.getElementById('fileInput').click()">
            <span class="scanner-icon">📸</span>
            <div class="scanner-title">Escanear o subir ticket</div>
            <div class="scanner-subtitle">Abre la cámara en el móvil o sube foto/PDF</div>
          </div>
          <input type="file" id="fileInput" accept="image/*,application/pdf" capture="environment">
          
          <div id="previewContainer">
            <img id="previewImg" src="" alt="Previsualización">
            <button type="button" class="remove-btn" onclick="removePhoto(event)">✕</button>
          </div>
        </div>

        <!-- Expense Concept -->
        <div class="form-group">
          <label for="concepto">Concepto / Nombre del Gasto <span class="req">*</span></label>
          <input type="text" id="concepto" name="concepto" placeholder="Ej: Cuerdas para campamento, Compra comida..." required>
        </div>

        <!-- Amount -->
        <div class="form-group">
          <label for="importe">Importe Exacto <span class="req">*</span></label>
          <div class="currency-input">
            <input type="number" id="importe" name="importe" step="0.01" min="0.01" placeholder="0.00" required>
            <span class="currency-symbol">€</span>
          </div>
        </div>

        <!-- Section Selection (Which Sheet) -->
        <div class="form-group">
          <label>Sección / Destino del Gasto <span class="req">*</span></label>
          <div class="chip-grid">
            <input type="radio" id="sec_mat" name="seccion" value="Material" class="chip-radio" checked>
            <label for="sec_mat" class="chip-label">⛺ Material</label>

            <input type="radio" id="sec_cas" name="seccion" value="Castores" class="chip-radio">
            <label for="sec_cas" class="chip-label">🦫 Castores</label>

            <input type="radio" id="sec_man" name="seccion" value="Manada" class="chip-radio">
            <label for="sec_man" class="chip-label">🐺 Manada</label>

            <input type="radio" id="sec_tro" name="seccion" value="Tropa" class="chip-radio">
            <label for="sec_tro" class="chip-label">⚜️ Tropa</label>

            <input type="radio" id="sec_esc" name="seccion" value="Escultas" class="chip-radio">
            <label for="sec_esc" class="chip-label">🪓 Pioneros</label>

            <input type="radio" id="sec_cla" name="seccion" value="Clan" class="chip-radio">
            <label for="sec_cla" class="chip-label">🔥 Rutas</label>

            <input type="radio" id="sec_kra" name="seccion" value="Kraal" class="chip-radio">
            <label for="sec_kra" class="chip-label">🦉 Kraal</label>

            <input type="radio" id="sec_otr" name="seccion" value="Otros" class="chip-radio">
            <label for="sec_otr" class="chip-label">📦 General</label>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="form-group">
          <label>Forma de Pago <span class="req">*</span></label>
          <div class="payment-grid">
            <input type="radio" id="pay_card" name="forma_pago" value="Tarjeta del Grupo" class="payment-radio" checked>
            <label for="pay_card" class="payment-label">💳 Tarjeta Grupo</label>

            <input type="radio" id="pay_trans" name="forma_pago" value="Transferencia / Bizum" class="payment-radio">
            <label for="pay_trans" class="payment-label">📱 Bizum / Banco</label>

            <input type="radio" id="pay_cash" name="forma_pago" value="Efectivo de Caja" class="payment-radio">
            <label for="pay_cash" class="payment-label">💶 Efectivo Caja</label>

            <input type="radio" id="pay_mon" name="forma_pago" value="Puesto por Monitor (A devolver)" class="payment-radio">
            <label for="pay_mon" class="payment-label">🙋 Adelanto Monitor</label>
          </div>
        </div>

        <!-- Monitor Name -->
        <div class="form-group">
          <label for="scouter">Monitor / Scouter que registra <span class="req">*</span></label>
          <input type="text" id="scouter" name="scouter" placeholder="Tu nombre o tótem" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Registrar Gasto</span>
          <span>➜</span>
        </button>

        <div id="statusAlert"></div>
      </form>
    </div>
  </div>

 <script>
    // Tu enlace de Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykbbKTT1OZQ1xfnoU_fgkgAqn5Kz6LAZH7LOdMmW7g7TS2xoI5rtJL4vnkQdFFwYg-MA/exec";

    let base64File = "";
    let fileName = "";
    let fileType = "image/jpeg";

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImg = document.getElementById('previewImg');
    const dropzone = document.getElementById('dropzone');

    // Motor de escaneado: Redimensión + Filtro de contraste de documento
    function processScannedReceipt(imgElement) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      const maxDim = 1500; // Resolución óptima para lectura de tickets
      let width = imgElement.naturalWidth || imgElement.width;
      let height = imgElement.naturalHeight || imgElement.height;
      
      if (width > height) {
        if (width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        }
      } else {
        if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(imgElement, 0, 0, width, height);
      
      // Aplicar filtro de contraste para efecto "escáner de oficina"
      const imgData = ctx.getImageData(0, 0, width, height);
      const d = imgData.data;
      
      for (let i = 0; i < d.length; i += 4) {
        // Luminancia estándar
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        
        // Aumenta el contraste y aclara el fondo del papel
        let adjusted = ((gray - 128) * 1.45) + 128;
        if (adjusted > 195) adjusted = 255; // Fondo blanco puro
        if (adjusted < 55) adjusted = 0;    // Texto negro puro
        adjusted = Math.min(255, Math.max(0, adjusted));
        
        d[i] = adjusted;
        d[i + 1] = adjusted;
        d[i + 2] = adjusted;
      }
      
      ctx.putImageData(imgData, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.65); // JPEG ligero de alta resolución
    }

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      fileName = "scan_" + file.name.replace(/\.[^/.]+$/, "") + ".jpg";

      const reader = new FileReader();
      reader.onload = function(event) {
        if (file.type.startsWith('image/')) {
          const tempImg = new Image();
          tempImg.onload = function() {
            // Se procesa la foto al instante convirtiéndola en escaneado
            const scannedDataUrl = processScannedReceipt(tempImg);
            base64File = scannedDataUrl.split(',')[1];
            previewImg.src = scannedDataUrl;
            previewContainer.style.display = 'block';
            dropzone.style.display = 'none';
          };
          tempImg.src = event.target.result;
        } else {
          // Si suben un PDF directamente
          base64File = event.target.result.split(',')[1];
          fileType = file.type;
          dropzone.innerHTML = `<span class="scanner-icon">📄</span><div class="scanner-title">${file.name}</div><div class="scanner-subtitle">Documento PDF cargado</div>`;
        }
      };
      reader.readAsDataURL(file);
    });

    function removePhoto(e) {
      if (e) e.stopPropagation();
      fileInput.value = "";
      base64File = "";
      fileName = "";
      previewContainer.style.display = 'none';
      dropzone.style.display = 'block';
      dropzone.innerHTML = `<span class="scanner-icon">📸</span><div class="scanner-title">Escanear ticket</div><div class="scanner-subtitle">Toma foto y la procesa como escaneado</div>`;
    }

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      const seccion = document.querySelector('input[name="seccion"]:checked').value;
      const formaPago = document.querySelector('input[name="forma_pago"]:checked').value;
      const concepto = document.getElementById('concepto').value;
      const importe = document.getElementById('importe').value;
      const scouter = document.getElementById('scouter').value;

      const payload = {
        fecha: new Date().toLocaleString('es-ES'),
        seccion: seccion,
        concepto: concepto,
        importe: parseFloat(importe),
        formaPago: formaPago,
        scouter: scouter,
        archivoBase64: base64File,
        nombreArchivo: fileName,
        tipoArchivo: "image/jpeg"
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = "Guardando documento...";
      statusAlert.style.display = 'none';

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusAlert.className = "alert-success";
        statusAlert.innerHTML = `✅ <b>¡Gasto y factura escaneada guardados en ${seccion}!</b>`;
        statusAlert.style.display = 'block';
        document.getElementById('expenseForm').reset();
        removePhoto();
      } catch (err) {
        statusAlert.className = "alert-error";
        statusAlert.innerHTML = "❌ Error al enviar. Comprueba la conexión.";
        statusAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Registrar Gasto</span><span>➜</span>";
      }
    });
  </script>
</body>
</html>

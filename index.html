<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesorería Grupo Scout Pío XII - Registro de Facturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4c1d95;       /* Morado principal */
      --primary-dark: #2e1065;  /* Morado muy oscuro */
      --primary-light: #f3e8ff; /* Morado claro */
      --accent: #d97706;        /* Dorado / Ámbar */
      --accent-gold: #f59e0b;   /* Dorado */
      --bg: #faf5ff;            /* Fondo suave */
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(76, 29, 149, 0.08), 0 8px 10px -6px rgba(76, 29, 149, 0.04);

      /* Colores de ramas scout */
      --col-castores: #ea580c;  /* Naranja */
      --col-manada: #f59e0b;    /* Amarillo */
      --col-tropa: #1e40af;     /* Azul Oscuro */
      --col-pioneros: #dc2626;  /* Rojo */
      --col-rutas: #16a34a;     /* Verde */
      --col-kraal: #0284c7;     /* Azul Claro */
      --col-dorado: #b45309;    /* Dorado para Material y Campamentos */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 14px 40px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-fleur {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      background: var(--primary);
      color: #fbbf24;
      border-radius: 50%;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(76, 29, 149, 0.3);
    }

    .header h1 {
      font-size: 23px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(76, 29, 149, 0.08);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151; /* Texto oscuro original */
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    label span.req {
      color: #ef4444;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: #fafafa;
      color: var(--text);
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(76, 29, 149, 0.12);
    }

    .currency-input {
      position: relative;
    }

    .currency-input input {
      padding-right: 40px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .currency-symbol {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      color: var(--text-muted);
      font-size: 18px;
    }

    /* Selector de Archivos / PDF / Foto */
    .scanner-box {
      border: 2px dashed #a855f7;
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      background: #faf5ff;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .scanner-box:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .scanner-icon {
      font-size: 34px;
      margin-bottom: 6px;
      display: block;
    }

    .scanner-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 3px;
    }

    .scanner-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    #previewContainer {
      display: none;
      position: relative;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      background: #f9fafb;
    }

    #previewImg {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      background: #f3f4f6;
      display: block;
    }

    .file-doc-preview {
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    .file-doc-preview .doc-icon {
      font-size: 32px;
    }

    .file-doc-preview .doc-info {
      flex: 1;
      overflow: hidden;
    }

    .file-doc-preview .doc-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-doc-preview .doc-size {
      font-size: 12px;
      color: var(--text-muted);
    }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Section Chips con colores por rama */
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .chip-radio {
      display: none;
    }

    .chip-label {
      display: block;
      text-align: center;
      padding: 10px 6px;
      background: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    /* Castores - Naranja */
    #sec_cas:checked + .chip-label {
      background: var(--col-castores);
      color: #ffffff;
      border-color: #c2410c;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
    }

    /* Manada - Amarillo */
    #sec_man:checked + .chip-label {
      background: var(--col-manada);
      color: #78350f;
      border-color: #d97706;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }

    /* Tropa - Azul Oscuro */
    #sec_tro:checked + .chip-label {
      background: var(--col-tropa);
      color: #ffffff;
      border-color: #172554;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.35);
    }

    /* Pioneros - Rojo */
    #sec_pio:checked + .chip-label {
      background: var(--col-pioneros);
      color: #ffffff;
      border-color: #991b1b;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }

    /* Rutas - Verde */
    #sec_rut:checked + .chip-label {
      background: var(--col-rutas);
      color: #ffffff;
      border-color: #14532d;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }

    /* Kraal - Azul Clarito */
    #sec_kra:checked + .chip-label {
      background: var(--col-kraal);
      color: #ffffff;
      border-color: #0369a1;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }

    /* Material y Campamentos - Dorado Scout */
    #sec_mat:checked + .chip-label,
    #camp_ini:checked + .chip-label,
    #camp_pas:checked + .chip-label,
    #camp_ver:checked + .chip-label {
      background: var(--col-dorado);
      color: #ffffff;
      border-color: #78350f;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.35);
    }

    /* Payment Radio Grid */
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .payment-radio {
      display: none;
    }

    .payment-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      background: #f9fafb;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .payment-radio:checked + .payment-label {
      background: #fef3c7;
      border-color: var(--accent);
      color: #92400e;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(76, 29, 149, 0.35);
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Status Alert */
    #statusAlert {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1.5px solid #86efac;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1.5px solid #fca5a5;
    }

    .code-box {
      background: #ffffff;
      border: 2px dashed #166534;
      padding: 14px;
      border-radius: 12px;
      margin: 12px 0;
    }

    .code-title {
      font-size: 12px;
      font-weight: 700;
      color: #166534;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .code-number {
      font-size: 34px;
      font-weight: 900;
      color: #166534;
      letter-spacing: 1.5px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge-fleur">⚜️</div>
      <h1>Tesorería Grupo Scout Pío XII</h1>
      <p>Registro de gastos, facturas y tickets</p>
    </div>

    <div class="card">
      <form id="expenseForm">
        
        <!-- Adjuntar Factura / PDF / Foto -->
        <div class="form-group">
          <label>Ticket o Factura (PDF o Imagen) <span class="req">*</span></label>
          <div class="scanner-box" id="dropzone" onclick="document.getElementById('fileInput').click()">
            <span class="scanner-icon">📎</span>
            <div class="scanner-title">Adjuntar archivo o foto</div>
            <div class="scanner-subtitle">Pulsa para elegir PDF, documento o foto</div>
          </div>
          <input type="file" id="fileInput" accept="application/pdf,image/*">
          
          <div id="previewContainer">
            <div id="imagePreviewWrapper" style="display: none;">
              <img id="previewImg" src="" alt="Previsualización">
            </div>
            <div id="pdfPreviewWrapper" class="file-doc-preview" style="display: none;">
              <div class="doc-icon">📄</div>
              <div class="doc-info">
                <div class="doc-name" id="pdfName">documento.pdf</div>
                <div class="doc-size" id="pdfSize">PDF listo para subir</div>
              </div>
            </div>
            <button type="button" class="remove-btn" onclick="removeFile(event)">✕</button>
          </div>
        </div>

        <!-- Concepto -->
        <div class="form-group">
          <label for="concepto">Concepto / Nombre del Gasto <span class="req">*</span></label>
          <input type="text" id="concepto" name="concepto" placeholder="Ej: Compra comida, Material acampada..." required>
        </div>

        <!-- Importe -->
        <div class="form-group">
          <label for="importe">Importe Exacto <span class="req">*</span></label>
          <div class="currency-input">
            <input type="number" id="importe" name="importe" step="0.01" min="0.01" placeholder="0.00" required>
            <span class="currency-symbol">€</span>
          </div>
        </div>

        <!-- Sección / Hoja -->
        <div class="form-group">
          <label>Sección / Destino del Gasto <span class="req">*</span></label>
          <div class="chip-grid">
            <input type="radio" id="sec_mat" name="seccion" value="Material" class="chip-radio" checked>
            <label for="sec_mat" class="chip-label">⛺ Material</label>

            <input type="radio" id="sec_cas" name="seccion" value="Castores" class="chip-radio">
            <label for="sec_cas" class="chip-label">🦫 Castores</label>

            <input type="radio" id="sec_man" name="seccion" value="Manada" class="chip-radio">
            <label for="sec_man" class="chip-label">🐺 Manada</label>

            <input type="radio" id="sec_tro" name="seccion" value="Tropa" class="chip-radio">
            <label for="sec_tro" class="chip-label">⚜️ Tropa</label>

            <input type="radio" id="sec_pio" name="seccion" value="Pioneros" class="chip-radio">
            <label for="sec_pio" class="chip-label">🪓 Pioneros</label>

            <input type="radio" id="sec_rut" name="seccion" value="Rutas" class="chip-radio">
            <label for="sec_rut" class="chip-label">⭐ Rutas</label>

            <input type="radio" id="sec_kra" name="seccion" value="Kraal" class="chip-radio">
            <label for="sec_kra" class="chip-label">🦉 Kraal</label>

            <input type="radio" id="camp_ini" name="seccion" value="Campamento Inicio" class="chip-radio">
            <label for="camp_ini" class="chip-label">⛰️ Camp. Inicio</label>
            
            <input type="radio" id="camp_pas" name="seccion" value="Campamento Pascua" class="chip-radio">
            <label for="camp_pas" class="chip-label">🐇 Camp. Pascua</label>
            
            <input type="radio" id="camp_ver" name="seccion" value="Campamento Verano" class="chip-radio">
            <label for="camp_ver" class="chip-label">☀️ Camp. Verano</label>
          </div>
        </div>

        <!-- Forma de Pago -->
        <div class="form-group">
          <label>Forma de Pago <span class="req">*</span></label>
          <div class="payment-grid">
            <input type="radio" id="pay_card" name="forma_pago" value="Tarjeta" class="payment-radio" checked>
            <label for="pay_card" class="payment-label">💳 Tarjeta</label>

            <input type="radio" id="pay_trans" name="forma_pago" value="Transferencia" class="payment-radio">
            <label for="pay_trans" class="payment-label">🏦 Transferencia</label>

            <input type="radio" id="pay_cash" name="forma_pago" value="Efectivo" class="payment-radio">
            <label for="pay_cash" class="payment-label">💶 Efectivo</label>

            <input type="radio" id="pay_mon" name="forma_pago" value="Puesto por Monitor (A devolver)" class="payment-radio">
            <label for="pay_mon" class="payment-label">🙋 Personal</label>
          </div>
        </div>

        <!-- Responsable -->
        <div class="form-group">
          <label for="scouter">Monitor / Scouter que registra <span class="req">*</span></label>
          <input type="text" id="scouter" name="scouter" placeholder="Tu nombre" required>
        </div>

        <!-- Botón Enviar -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Registrar Gasto</span>
          <span>➜</span>
        </button>

        <div id="statusAlert"></div>
      </form>
    </div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = "URL_DE_TU_GOOGLE_APPS_SCRIPT";

    let base64File = "";
    let fileName = "";
    let fileType = "";

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const imageWrapper = document.getElementById('imagePreviewWrapper');
    const pdfWrapper = document.getElementById('pdfPreviewWrapper');
    const previewImg = document.getElementById('previewImg');
    const pdfName = document.getElementById('pdfName');
    const pdfSize = document.getElementById('pdfSize');
    const dropzone = document.getElementById('dropzone');

    function compressImage(imgElement) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const maxDim = 1600;
      let width = imgElement.naturalWidth || imgElement.width;
      let height = imgElement.naturalHeight || imgElement.height;
      
      if (width > height && width > maxDim) {
        height = Math.round((height * maxDim) / width);
        width = maxDim;
      } else if (height > maxDim) {
        width = Math.round((width * maxDim) / height);
        height = maxDim;
      }
      
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(imgElement, 0, 0, width, height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      fileName = file.name;
      fileType = file.type;

      const reader = new FileReader();
      reader.onload = function(event) {
        if (file.type.startsWith('image/')) {
          const tempImg = new Image();
          tempImg.onload = function() {
            const compressedDataUrl = compressImage(tempImg);
            base64File = compressedDataUrl.split(',')[1];
            fileType = "image/jpeg";
            previewImg.src = compressedDataUrl;
            imageWrapper.style.display = 'block';
            pdfWrapper.style.display = 'none';
            previewContainer.style.display = 'block';
            dropzone.style.display = 'none';
          };
          tempImg.src = event.target.result;
        } else {
          base64File = event.target.result.split(',')[1];
          pdfName.textContent = file.name;
          pdfSize.textContent = (file.size / 1024).toFixed(1) + " KB • Documento PDF";
          imageWrapper.style.display = 'none';
          pdfWrapper.style.display = 'flex';
          previewContainer.style.display = 'block';
          dropzone.style.display = 'none';
        }
      };
      reader.readAsDataURL(file);
    });

    function removeFile(e) {
      if (e) e.stopPropagation();
      fileInput.value = "";
      base64File = "";
      fileName = "";
      fileType = "";
      previewContainer.style.display = 'none';
      imageWrapper.style.display = 'none';
      pdfWrapper.style.display = 'none';
      dropzone.style.display = 'block';
    }

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      const seccion = document.querySelector('input[name="seccion"]:checked').value;
      const formaPago = document.querySelector('input[name="forma_pago"]:checked').value;
      const concepto = document.getElementById('concepto').value;
      const importe = document.getElementById('importe').value;
      const scouter = document.getElementById('scouter').value;

      const payload = {
        fecha: new Date().toLocaleString('es-ES'),
        seccion: seccion,
        concepto: concepto,
        importe: parseFloat(importe),
        formaPago: formaPago,
        scouter: scouter,
        archivoBase64: base64File,
        nombreArchivo: fileName,
        tipoArchivo: fileType
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = "Guardando gasto...";
      statusAlert.style.display = 'none';

      if (APPS_SCRIPT_URL === "URL_DE_TU_GOOGLE_APPS_SCRIPT") {
        setTimeout(() => {
          const prefixMap = {
            "Material": "MAT",
            "Castores": "CAS",
            "Manada": "MAN",
            "Tropa": "TRO",
            "Pioneros": "PIO",
            "Rutas": "RUT",
            "Kraal": "KRA",
            "Campamento Inicio": "C-INI",
            "Campamento Pascua": "C-PAS",
            "Campamento Verano": "C-VER"
          };
          const mockPrefix = prefixMap[seccion] || "GAS";
          const mockCode = mockPrefix + "-5";
          statusAlert.className = "alert-success";
          statusAlert.innerHTML = `
            <div style="font-size: 17px; font-weight: 800; margin-bottom: 6px;">✅ ¡Gasto registrado!</div>
            <div class="code-box">
              <span class="code-title">Código para el ticket físico</span>
              <div class="code-number">${mockCode}</div>
            </div>
            <div style="font-size: 13px; line-height: 1.4;">✍️ <b>Apunta con boli "${mockCode}"</b> en la esquina del ticket físico.<br><small>(Configura la URL de Apps Script para guardar en tu Excel real)</small></div>
          `;
          statusAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = "<span>Registrar Gasto</span><span>➜</span>";
          document.getElementById('expenseForm').reset();
          removeFile();
        }, 800);
        return;
      }

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === "success") {
          statusAlert.className = "alert-success";
          statusAlert.innerHTML = `
            <div style="font-size: 17px; font-weight: 800; margin-bottom: 6px;">✅ ¡Gasto registrado con éxito!</div>
            <div class="code-box">
              <span class="code-title">Código para el ticket físico</span>
              <div class="code-number">${res.ticketCode}</div>
            </div>
            <div style="font-size: 13px; line-height: 1.4;">✍️ <b>Apunta con boli "${res.ticketCode}"</b> en la esquina del ticket físico y guárdalo en la carpeta.</div>
          `;
          statusAlert.style.display = 'block';
          document.getElementById('expenseForm').reset();
          removeFile();
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        statusAlert.className = "alert-error";
        statusAlert.innerHTML = "❌ Error al enviar. Comprueba la conexión o la URL.";
        statusAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Registrar Gasto</span><span>➜</span>";
      }
    });
  </script>
</body>
</html>
